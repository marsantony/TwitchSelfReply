name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: marsantony/marsantony.github.io
          path: marsantony.github.io
      - name: Symlink sibling repo for tests
        run: ln -s $GITHUB_WORKSPACE/marsantony.github.io ../marsantony.github.io
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
